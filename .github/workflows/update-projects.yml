name: Actualizar proyectos

on:
  schedule:
    - cron: "17 6 * * 1" # cada lunes
  workflow_dispatch: # también a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-projects.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit si hay cambios
        run: |
          if git diff --quiet; then echo "Nada que subir."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Actualizar proyectos del README"
          git push
